<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signup Page</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="signup-container">
    <div class="form-wrapper">
      <h1>Sign Up</h1>
      <form id="signupForm">
        <input type="text" id="username" placeholder="Username" required />
        <input type="email" id="email" placeholder="Email" required />
          <input type="password" id="password" placeholder="Password" required />
          <div class="password-wrapper">
          <label>
            <input type="checkbox" id="togglePassword" />
            Show password
          </label>
        </div>
        <button type="button" id="signupButton">Sign Up</button>
        <div class="social-links">
          <a href="#"><img src="https://img.icons8.com/ios-filled/24/00a678/twitter.png" alt="Twitter"></a>
          <a href="#"><img src="https://img.icons8.com/ios-filled/24/00a678/google-logo.png" alt="Google"></a>
          <a href="#"><img src="https://img.icons8.com/ios-filled/24/00a678/facebook.png" alt="Facebook"></a>
        </div>
        <p class="login-link">Already a user? <a href="#">Login</a></p>
      </form>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
