</style>
</head> <body> <div class="container"> <header class="header">Header</header> <aside class="leftaside">Left Aside</aside> <main class="main"><h1>Main Content</h1> </main> <section class="banner">Banner</section> <aside class="rightaside">Right Side</aside>

</div>
