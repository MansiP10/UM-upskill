<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gradient Color Generator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>Gradient Color Generator</h1>
    <form id="gradient-form">
      <label for="gradient-type">Select Gradient Type:</label>
      <select id="gradient-type">
        <option value="linear">Linear</option>
        <option value="radial">Radial</option>
      </select>

      <label for="color1">Color 1:</label>
      <input type="color" id="color1" value="#ff0000">

      <label for="color2">Color 2:</label>
      <input type="color" id="color2" value="#0000ff">

      <label for="direction">Gradient Direction:</label>
      <input type="range" id="direction" min="0" max="360" value="90">
      <span id="direction-value">90°</span>

      <label for="speed">Animation Speed (s):</label>
      <input type="number" id="speed" min="1" max="10" value="5">

      <button type="button" id="generate-btn">Generate CSS</button>
    </form>
    <div class="output">
    <div class="preview" id="gradient-preview"></div>
    <textarea id="css-code" readonly></textarea>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
