<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DOM Array Methods - Billing Sheet</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>DOM Array Methods</h1>
      <div class="buttons">
        <button id="addUserBtn">Add User 🧑‍💻</button>
        <button id="doubleMoneyBtn">Double Money 💵</button>
        <button id="showMillionairesBtn">Show Only Millionaires 💰</button>
        <button id="sortRichestBtn">Sort by Richest ⬇️</button>
        <button id="calculateWealthBtn">Calculate entire Wealth 💸</button>
      </div>
      <div class="user-table">
        <div class="table-header">
          <span>Person</span>
          <span>Wealth</span>
        </div>
        <div id="usersList"></div>
      </div>
      <div id="totalWealth" class="total-wealth"></div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
