<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Netflix Mobile Navigation</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body>
    <button class="netflix-nav-btn netflix-open-btn">
        <i class="fa fa-bars" style="font-size:36px"></i>
    </button>
    
    <img class="netflix-logo" src="https://images.unsplash.com/photo-1663775635512-c60be8b302b0?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&ixid=M3wxMTc3M3wwfDF8c2VhcmNofDM3fHxuZXRmbGl4fGVufDB8fHx8MTcyMjE2NDIzMHww&ixlib=rb-4.0.3&q=80&w=2000" alt="Netflix Logo" />    
    <div class="netflix-nav netflix-nav-black">
        <div class="netflix-nav netflix-nav-red">
            <div class="netflix-nav netflix-nav-white">
                <button class="netflix-nav-btn netflix-close-btn"><i class="fa fa-close" style="font-size:36px"></i></button>
                <img class="site-logo" src="https://logodix.com/logo/2210324.png" alt="Netflix Logo" />
                <ul class="netflix-list">
                    <li><a href="#">Teams</a></li>
                    <li><a href="#">Locations</a></li>
                    <li><a href="#">Life at netflix</a></li>
                    <li>
                        <ul>
                            <li><a href="#">Netflix culture memo</a></li>
                            <li><a href="#">Work life philosophy</a></li>
                            <li><a href="#">Inclusion & Diversity</a></li>
                            <li><a href="#">Wearenetflix</a></li>
                            <li><a href="#">Blog</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </div>
  <script src="script.js"></script>
</body>
</html>
