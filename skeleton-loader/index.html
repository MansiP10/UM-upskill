<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card with Skeleton Loader</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="card" id="card-content">
      <div id="card-header" class="ani_bg" >&nbsp;</div>
      <div class="card-body">
        <h3 id="card-title" class="ani_bg_text">&nbsp;</h3>
        <p id="card-description" class="ani_bg_text">&nbsp;</p>
        <div class="card-footer">
          <div id="card-img" class="ani_bg">&nbsp;</div>
          <div class="author-info">
            <span id="author-name" class="ani_bg_text">&nbsp;</span>
            <span id="date" class="ani_bg_text">&nbsp;</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
