<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <title>Responsive Webpage</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="text-section">
            <h1>
                LET'S RIDE <span>THE FUTURE.</span>
            </h1>
            <hr class="line">
            <p>Simple and sleek design with users in mind.</p>
            <div class="buttons">
                <div>
                    <button><i class="fa fa-long-arrow-right" style="font-size:20px"></i></button>
                    <a href="#">Buy now</a>
                </div>
                <div>
                    <a href="#">Watch our video how it works</a>
                </div>
            </div>
        </div>
        <div class="image-section">
            <img src="image.png" alt="Sleek scooter design">
        </div>
    </div>
    <div class="footer">
        <div class="number">01</div>
        <div class="navigation">
            <button>&lt;</button>
            <button>&gt;</button>
        </div>
    </div>
</body>
</html>
